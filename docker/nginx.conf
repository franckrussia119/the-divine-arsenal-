server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location = /js/config.js { add_header Cache-Control "no-store"; }
  location ~* \.(css|js|png|docx)$ { add_header Cache-Control "public, max-age=3600"; }
  gzip on;
  gzip_types text/css application/javascript application/json;
}
